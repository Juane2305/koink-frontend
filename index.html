<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate">
    <link rel="icon" type="image/svg+xml" href="https://res.cloudinary.com/dfschbyq2/image/upload/v1745361152/Blue_Modern_Letter_K_Logo_xmupfi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Koink App</title>
    <style>
      /* Estilos críticos para que carguen al instante */
      body { margin: 0; background-color: #0a0a0a; }
      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .logo-img {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }
      .loader-bar {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .loader-progress {
        width: 100%;
        height: 100%;
        background: #6366f1;
        animation: loading 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-container">
        <img src="https://res.cloudinary.com/dfschbyq2/image/upload/v1745361152/Blue_Modern_Letter_K_Logo_xmupfi.png" class="logo-img" alt="Koink Logo">
        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
